[pytest]
testpaths = tests
pythonpath = .

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -q
    --strict-markers
    --tb=short

timeout = 60

markers =
    slow: takes seconds rather than milliseconds (concurrency, retention, workers)

filterwarnings =
    ignore::DeprecationWarning:websockets.*
